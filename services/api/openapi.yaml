openapi: 3.0.3
info:
  title: PredictIQ API
  version: 1.0.0
  description: |
    REST API for the PredictIQ prediction markets platform.

    ## API Versioning

    The API uses URL path versioning (`/api/v1/`). The current stable version is **v1**.

    Clients may also send an `API-Version` header (e.g. `API-Version: v1`) to explicitly
    declare the version they target. If omitted, the server defaults to the current version.

    ## Deprecation Policy

    When a version is deprecated:
    - Responses will include a `Deprecation` header set to `true`.
    - A `Sunset` header will indicate the date after which the version will be removed.
    - A `Link` header will point to migration documentation.

    Clients should monitor these headers and migrate before the sunset date.

    Deprecated versions are supported for a minimum of **12 months** after the deprecation
    announcement before being removed.

servers:
  - url: http://0.0.0.0:8080
    description: Local development (default bind 0.0.0.0:8080)

tags:
  - name: health
  - name: markets
  - name: blockchain
  - name: newsletter
  - name: email
  - name: webhooks
  - name: audit
    description: Audit log retrieval and statistics (admin, requires ApiKeyAuth)

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: ok
        "500":
          $ref: "#/components/responses/ApiError"

  /health/live:
    get:
      tags: [health]
      operationId: getHealthLive
      summary: Liveness probe
      responses:
        "200":
          description: Process is alive
          content:
            text/plain:
              schema:
                type: string

  /health/ready:
    get:
      tags: [health]
      operationId: getHealthReady
      summary: Readiness probe
      responses:
        "200":
          description: Service is ready
          content:
            text/plain:
              schema:
                type: string
        "503":
          $ref: "#/components/responses/ApiError"

  /health/dependencies:
    get:
      tags: [health]
      operationId: getHealthDependencies
      summary: Dependency health (database, cache, RPC)
      responses:
        "200":
          description: Dependency status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyObject"
        "503":
          $ref: "#/components/responses/ApiError"

  /metrics:
    get:
      tags: [health]
      operationId: getMetrics
      summary: Prometheus metrics
      responses:
        "200":
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema:
                type: string

  /api/v1/newsletter/gdpr/request-token:
    post:
      tags: [newsletter]
      operationId: newsletterGdprRequestToken
      summary: Request a GDPR verification token by email
      description: |
        Sends a short-lived verification token to the supplied address. The token
        is required by the GDPR export and delete endpoints. The response is the
        same whether or not the address is subscribed, to avoid leaking membership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Verification email sent if the address is subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterResponse"
        "400":
          $ref: "#/components/responses/NewsletterResponse"
        "429":
          $ref: "#/components/responses/NewsletterResponse"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/newsletter/gdpr/request-token/verify:
    get:
      tags: [newsletter]
      operationId: newsletterGdprVerifyToken
      summary: Verify a GDPR request token
      description: |
        Validates a GDPR verification token issued by
        `POST /api/v1/newsletter/gdpr/request-token`. Returns whether the token is
        currently valid and the email address it was issued for.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GdprTokenVerification"
        "400":
          $ref: "#/components/responses/NewsletterResponse"
        "404":
          $ref: "#/components/responses/NewsletterResponse"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/admin/api-keys:
    get:
      tags: [audit]
      operationId: listApiKeys
      summary: List active API keys (admin)
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Active API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKeyView"
        "401":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
    post:
      tags: [audit]
      operationId: createApiKey
      summary: Create a new API key (admin)
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Key created; the plaintext secret is returned only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeySecret"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/admin/api-keys/rotate:
    post:
      tags: [audit]
      operationId: rotateApiKey
      summary: Issue a new API key and expire the old one after an overlap window (admin)
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateApiKeyRequest"
      responses:
        "201":
          description: New key issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeySecret"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/admin/api-keys/{id}:
    get:
      tags: [audit]
      operationId: getApiKey
      summary: Retrieve a single API key's metadata (admin)
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/apiKeyId"
      responses:
        "200":
          description: API key metadata (never includes the secret)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyView"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
    delete:
      tags: [audit]
      operationId: revokeApiKey
      summary: Revoke an API key immediately (admin)
      description: |
        Sets `revoked_at` on the target key. Once revoked, any request presenting
        the key is rejected with `401 Unauthorized` by the authentication layer.
        Revocation is idempotent: revoking an already-revoked key succeeds.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/apiKeyId"
      responses:
        "204":
          description: Key revoked (or already revoked)
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/statistics:
    get:
      tags: [markets]
      operationId: getStatistics
      summary: Platform statistics
      parameters:
        - $ref: "#/components/parameters/apiVersion"
      responses:
        "200":
          description: Statistics payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyObject"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/markets/featured:
    get:
      tags: [markets]
      operationId: getFeaturedMarkets
      summary: List featured markets
      parameters:
        - $ref: "#/components/parameters/apiVersion"
      responses:
        "200":
          description: Array of featured markets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeaturedMarketView"
        "400":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/content:
    get:
      tags: [markets]
      operationId: getContent
      summary: Paginated content feed
      parameters:
        - $ref: "#/components/parameters/apiVersion"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Content payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyObject"
        "400":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/markets/{market_id}/resolve:
    post:
      tags: [markets]
      operationId: resolveMarket
      summary: Resolve a market and invalidate caches (admin)
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/marketId"
        - $ref: "#/components/parameters/apiVersion"
      responses:
        "200":
          description: Cache invalidation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidationResult"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/markets/{market_id}/cancel:
    post:
      tags: [markets]
      operationId: cancelMarket
      summary: Cancel a market and invalidate caches (admin)
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/marketId"
        - $ref: "#/components/parameters/apiVersion"
      responses:
        "200":
          description: Cache invalidation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidationResult"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/blockchain/health:
    get:
      tags: [blockchain]
      operationId: getBlockchainHealth
      summary: Blockchain node and contract health
      parameters:
        - $ref: "#/components/parameters/apiVersion"
      description: |
        Returns the health of the blockchain node and contract.

        **`status` values:**
        - `healthy` – node reachable and contract readable. HTTP 200.
        - `degraded` – node reachable but contract read failed. HTTP 503.
        - `unhealthy` – node unreachable. HTTP 503.

        `is_healthy` is `true` only when `status == "healthy"` (backwards-compatible field).
      responses:
        "200":
          description: Node and contract are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockchainHealth"
        "400":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
        "503":
          description: Degraded (node up, contract unreachable) or unhealthy (node down)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockchainHealth"

  /api/v1/blockchain/markets:
    post:
      tags: [blockchain]
      operationId: createMarket
      summary: Create a prediction market (wallet-signing required — see #77)
      description: |
        Registers a new prediction market.

        **Status: 501 Not Implemented**

        The full market-creation flow requires the caller to sign the Stellar
        transaction with their wallet private key. The API server does not hold
        user keys, so this step cannot be completed server-side until the
        wallet-signing integration described in issue #77 is implemented.

        Until then:
        - The route **exists** and validates the request body (no more 404/405).
        - A `501 Not Implemented` response is returned with a clear message.
        - Callers should build and sign the `CreateMarket` contract-invocation
          transaction directly with the Stellar SDK and submit it via Soroban RPC.
      parameters:
        - $ref: "#/components/parameters/apiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMarketRequest"
      responses:
        "400":
          description: Validation error (missing/invalid fields)
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "501":
          description: Not yet implemented — use the Stellar SDK for wallet-signed market creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMarketResponse"

  /api/v1/blockchain/markets/{market_id}:
    get:
      tags: [blockchain]
      operationId: getBlockchainMarket
      summary: On-chain market data
      parameters:
        - $ref: "#/components/parameters/marketId"
        - $ref: "#/components/parameters/apiVersion"
      responses:
        "200":
          description: Market chain data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyObject"
        "400":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/blockchain/stats:
    get:
      tags: [blockchain]
      operationId: getBlockchainStats
      summary: Platform on-chain statistics
      parameters:
        - $ref: "#/components/parameters/apiVersion"
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyObject"
        "400":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/blockchain/users/{user}/bets:
    get:
      tags: [blockchain]
      operationId: getUserBets
      summary: Bets placed by a user
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
          description: Stellar public key (G…, 56 chars, valid checksum)
        - $ref: "#/components/parameters/apiVersion"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: User bets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyObject"
        "400":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/blockchain/oracle/{market_id}:
    get:
      tags: [blockchain]
      operationId: getOracleResult
      summary: Oracle result for a market
      parameters:
        - $ref: "#/components/parameters/marketId"
        - $ref: "#/components/parameters/apiVersion"
      responses:
        "200":
          description: Oracle result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyObject"
        "400":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/blockchain/tx/{tx_hash}:
    get:
      tags: [blockchain]
      operationId: getTransactionStatus
      summary: Transaction status by hash
      parameters:
        - name: tx_hash
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/apiVersion"
      responses:
        "200":
          description: Transaction status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyObject"
        "400":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/newsletter/subscribe:
    post:
      tags: [newsletter]
      operationId: newsletterSubscribe
      summary: Subscribe to newsletter
      parameters:
        - $ref: "#/components/parameters/apiVersion"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscribeRequest"
      responses:
        "200":
          $ref: "#/components/responses/NewsletterResponse"
        "400":
          $ref: "#/components/responses/NewsletterResponse"
        "409":
          $ref: "#/components/responses/NewsletterResponse"
        "429":
          $ref: "#/components/responses/NewsletterResponse"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/newsletter/confirm:
    get:
      tags: [newsletter]
      operationId: newsletterConfirm
      summary: Confirm newsletter subscription via token
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/NewsletterResponse"
        "400":
          $ref: "#/components/responses/NewsletterResponse"
        "404":
          $ref: "#/components/responses/NewsletterResponse"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/newsletter/unsubscribe:
    delete:
      tags: [newsletter]
      operationId: newsletterUnsubscribe
      summary: Unsubscribe from newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          $ref: "#/components/responses/NewsletterResponse"
        "400":
          $ref: "#/components/responses/NewsletterResponse"
        "404":
          $ref: "#/components/responses/NewsletterResponse"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/newsletter/gdpr/export:
    post:
      tags: [newsletter]
      operationId: newsletterGdprExport
      summary: GDPR data export for a subscriber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Subscriber data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterExportResponse"
        "400":
          $ref: "#/components/responses/NewsletterResponse"
        "404":
          $ref: "#/components/responses/NewsletterResponse"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/newsletter/gdpr/delete:
    delete:
      tags: [newsletter]
      operationId: newsletterGdprDelete
      summary: GDPR data deletion for a subscriber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          $ref: "#/components/responses/NewsletterResponse"
        "400":
          $ref: "#/components/responses/NewsletterResponse"
        "404":
          $ref: "#/components/responses/NewsletterResponse"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/email/preview/{template_name}:
    get:
      tags: [email]
      operationId: emailPreview
      summary: Preview a rendered email template (admin)
      security:
        - ApiKeyAuth: []
      parameters:
        - name: template_name
          in: path
          required: true
          schema:
            type: string
            enum:
              - newsletter_confirmation
              - waitlist_confirmation
              - contact_form_auto_response
              - welcome_email
      responses:
        "200":
          description: Rendered email preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyObject"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/email/test:
    post:
      tags: [email]
      operationId: emailSendTest
      summary: Send a test email (admin)
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailTestRequest"
      responses:
        "200":
          description: Test email result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTestResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/email/analytics:
    get:
      tags: [email]
      operationId: getEmailAnalytics
      summary: Email analytics (admin)
      security:
        - ApiKeyAuth: []
      parameters:
        - name: template_name
          in: query
          required: false
          schema:
            type: string
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyObject"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/email/queue/stats:
    get:
      tags: [email]
      operationId: getEmailQueueStats
      summary: Email queue statistics (admin)
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Queue stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyObject"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/blockchain/replay:
    post:
      tags: [blockchain]
      operationId: blockchainReplay
      summary: Replay blockchain events (admin)
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Replay result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyObject"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/email/queue/dead-letter:
    get:
      tags: [email]
      operationId: getEmailDeadLetterList
      summary: List dead-letter email jobs (admin)
      security:
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          description: Opaque cursor from a previous response's `next_cursor`
          schema: { type: string }
      responses:
        "200":
          description: Dead-letter job list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyObject"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/email/queue/dead-letter/{job_id}/requeue:
    post:
      tags: [email]
      operationId: requeueEmailDeadLetterJob
      summary: Requeue a dead-letter email job (admin)
      security:
        - ApiKeyAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
          description: Dead-letter job identifier
      responses:
        "200":
          description: Requeue result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyObject"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/audit/logs:
    get:
      tags: [audit]
      operationId: getAuditLogs
      summary: Retrieve audit log entries (admin)
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyObject"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

  /api/v1/audit/statistics:
    get:
      tags: [audit]
      operationId: getAuditStatistics
      summary: Retrieve audit event statistics (admin)
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Audit statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyObject"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

  /webhooks/sendgrid:
    post:
      tags: [webhooks]
      operationId: sendgridWebhook
      summary: SendGrid event webhook receiver (provider-signed)
      description: |
        Receives webhook events from SendGrid for email delivery, bounce, complaint, 
        and engagement tracking (opens, clicks, unsubscribes).
        
        ## Security Model
        
        This endpoint uses **provider signature verification** (not API key authentication).
        
        - **Authentication**: HMAC-SHA256 signature in `X-Twilio-Email-Event-Webhook-Signature` header
        - **Timestamp verification**: `X-Twilio-Email-Event-Webhook-Timestamp` must be within 300 seconds
        - **Replay protection**: Checked per (message_id, event_type, recipient, timestamp)
        
        This security model is appropriate for webhooks because:
        1. SendGrid is the only caller (not user-initiated)
        2. Signature proves the provider encrypted the request
        3. No need for per-user API keys on public-facing webhook endpoints
        
      security:
        - SendGridWebhook: []
      parameters:
        - name: X-Twilio-Email-Event-Webhook-Signature
          in: header
          required: true
          schema:
            type: string
          description: HMAC-SHA256 signature of timestamp+body, base64-encoded. Signature is computed as Base64(HMAC-SHA256(secret, timestamp+body))
        - name: X-Twilio-Email-Event-Webhook-Timestamp
          in: header
          required: true
          schema:
            type: string
            format: int64
          description: Unix timestamp of the request (replay protection window is 300 seconds)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/AnyObject"
      responses:
        "200":
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  processed:
                    type: integer
                    description: Number of events processed
                  errors:
                    type: array
                    items:
                      type: string
                    nullable: true
                    description: List of processing errors, if any
        "400":
          description: Invalid request or signature
          $ref: "#/components/responses/ApiError"
        "401":
          description: Signature verification failed (not authorized as SendGrid)
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"

components:
  parameters:
    apiVersion:
      name: API-Version
      in: header
      required: false
      schema:
        type: string
        enum: [v1]
        default: v1
      description: |
        Target API version. Defaults to the current stable version (`v1`).
        Responses for deprecated versions include `Deprecation`, `Sunset`, and `Link` headers.
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: |
        Client-generated unique key (e.g. UUID v4) to deduplicate mutating requests.
        If a request with the same key was processed within the idempotency window,
        the cached response is returned immediately without re-executing the operation.
    marketId:
      name: market_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        default: 1
    pageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 100
        default: 20
    apiKeyId:
      name: id
      in: path
      required: true
      description: API key identifier
      schema:
        type: string
        format: uuid

  schemas:
    AnyObject:
      type: object
      additionalProperties: true

    BlockchainHealth:
      type: object
      required: [network, rpc_url, latest_ledger, status, is_healthy, contract_reachable, checked_at_unix, data_source]
      properties:
        network:
          type: string
        rpc_url:
          type: string
        latest_ledger:
          type: integer
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
          description: healthy = node + contract OK; degraded = node OK but contract unreadable; unhealthy = node unreachable
        is_healthy:
          type: boolean
          description: true only when status is healthy (backwards-compatible)
        contract_reachable:
          type: boolean
        checked_at_unix:
          type: integer
        data_source:
          type: string
          enum: [live, stale_cache, rpc_fallback]

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: INTERNAL_ERROR
        message:
          type: string
          description: Human-readable error description
        details:
          type: object
          additionalProperties: true
          nullable: true
          description: Optional additional context about the error

    FeaturedMarketView:
      type: object
      required: [id, title, volume, ends_at, onchain_volume]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        volume:
          type: string
        ends_at:
          type: string
          format: date-time
        onchain_volume:
          type: string
        resolved_outcome:
          type: integer
          format: int32
          nullable: true

    InvalidationResult:
      type: object
      required: [invalidated_keys, cache_invalidated]
      properties:
        invalidated_keys:
          type: integer
        cache_invalidated:
          type: boolean

    NewsletterSubscribeRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        source:
          type: string
          maxLength: 64

    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    NewsletterResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string

    NewsletterExportResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/AnyObject"

    GdprTokenVerification:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
          description: Whether the token is currently valid and unexpired
        email:
          type: string
          format: email
          nullable: true
          description: Address the token was issued for, when valid
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Expiry timestamp of the token, when valid

    ApiKeyView:
      type: object
      required: [id, name, created_at, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Human-readable label for the key
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: Set when the key has been revoked; revoked keys are rejected on authentication

    ApiKeySecret:
      type: object
      required: [id, name, key, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key:
          type: string
          description: Plaintext API key secret. Returned only once, at creation or rotation.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true

    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 128
        expires_at:
          type: string
          format: date-time
          nullable: true

    RotateApiKeyRequest:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the key to rotate
        overlap_seconds:
          type: integer
          format: int64
          minimum: 0
          description: Window during which the old key remains valid alongside the new one

    EmailTestRequest:
      type: object
      required: [recipient, template_name]
      properties:
        recipient:
          type: string
          format: email
        template_name:
          type: string

    EmailTestResponse:
      type: object
      required: [success, message, message_id]
      properties:
        success:
          type: boolean
        message:
          type: string
        message_id:
          type: string

    OracleConfigRequest:
      type: object
      required: [oracle_address, feed_id, max_staleness_seconds, max_confidence_bps]
      properties:
        oracle_address:
          type: string
          description: Stellar account address of the oracle contract.
        feed_id:
          type: string
          description: Feed identifier used by the oracle (e.g. "BTC/USD").
        max_staleness_seconds:
          type: integer
          format: int64
          minimum: 0
          description: Maximum age of an accepted oracle reading, in seconds.
        max_confidence_bps:
          type: integer
          format: int64
          minimum: 0
          description: Maximum confidence band accepted from the oracle, in basis points.

    CreateMarketRequest:
      type: object
      required:
        - creator
        - description
        - options
        - deadline
        - resolution_deadline
        - oracle_config
        - tier
        - native_token
        - parent_id
        - parent_outcome_idx
      properties:
        creator:
          type: string
          description: Stellar account address that will be recorded as the market creator.
        description:
          type: string
          description: Human-readable description of the prediction question.
        options:
          type: array
          items:
            type: string
          minItems: 2
          description: Ordered list of outcome labels (minimum 2).
        deadline:
          type: integer
          format: int64
          minimum: 0
          description: Unix timestamp (seconds) at which the market stops accepting bets. Must be in the future.
        resolution_deadline:
          type: integer
          format: int64
          minimum: 0
          description: Unix timestamp (seconds) after which the oracle may resolve the market. Must be at least `deadline + 86400`.
        oracle_config:
          $ref: "#/components/schemas/OracleConfigRequest"
        tier:
          type: string
          enum: [Basic, Pro, Institutional]
          description: Market tier.
        native_token:
          type: string
          description: Native token contract address used for payouts.
        parent_id:
          type: integer
          format: int64
          minimum: 0
          description: Parent market ID for conditional markets (0 = top-level market).
        parent_outcome_idx:
          type: integer
          format: int32
          minimum: 0
          description: Outcome index within the parent market that activates this market.

    CreateMarketResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
          description: Human-readable explanation of why the request could not be completed server-side.

  responses:
    ApiError:
      description: Error response with machine-readable code
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NewsletterResponse:
      description: Newsletter operation result
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NewsletterResponse"

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Admin API key required for protected endpoints
    SendGridWebhook:
      type: apiKey
      in: header
      name: X-Twilio-Email-Event-Webhook-Signature
      description: HMAC-SHA256 signature provided by SendGrid on webhook delivery
