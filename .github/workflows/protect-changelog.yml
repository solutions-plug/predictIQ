name: Protect CHANGELOG

on:
  pull_request:
    paths:
      - "CHANGELOG.md"

jobs:
  block-manual-changelog:
    name: Block manual CHANGELOG edits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Documented, scoped exception: the release workflow (release.yml) opens
      # an automated PR from branch changelog-update/<tag> via
      # github-actions[bot] to update CHANGELOG.md instead of pushing to main
      # directly. That PR is intentionally allowed through here; every other
      # PR touching CHANGELOG.md is still blocked.
      - name: Fail if CHANGELOG.md was manually edited
        if: |
          !(github.actor == 'github-actions[bot]' &&
            startsWith(github.head_ref, 'changelog-update/'))
        run: |
          echo "❌ CHANGELOG.md must not be edited manually."
          echo "It is auto-generated by git-cliff on release."
          echo "Remove the CHANGELOG.md change from this PR."
          exit 1
