name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  validate-release:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Validate CHANGELOG.md entry exists
        run: |
          VERSION=${{ steps.version.outputs.version }}
          if ! grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "❌ CHANGELOG.md missing entry for version $VERSION"
            echo "Add a section like: ## [$VERSION] - $(date +%Y-%m-%d)"
            exit 1
          fi
          echo "✅ CHANGELOG.md entry found for version $VERSION"

  changelog:
    name: Generate Changelog & Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        id: cliff
        with:
          config: cliff.toml
          args: --verbose --tag ${{ github.ref_name }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Open changelog update PR
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(changelog): update for ${{ github.ref_name }} [skip ci]"
          title: "chore(changelog): update CHANGELOG.md for ${{ github.ref_name }}"
          body: |
            Automated CHANGELOG.md update generated by git-cliff for release ${{ github.ref_name }}.

            This PR is opened by the release workflow instead of pushing directly to
            `main`, so branch protection and required checks apply the same way they
            do to any other change.
          branch: changelog-update/${{ github.ref_name }}
          base: main
          delete-branch: true
          add-paths: CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: ${{ steps.cliff.outputs.content }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: CHANGELOG.md
          if-no-files-found: ignore

  build-and-publish-wasm:
    name: Build & Publish WASM Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate-release
    steps:
      - uses: actions/checkout@v4

      - name: Download tested WASM artifact from contract-deployment
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: contract-deployment.yml
          name: contract-wasm
          path: wasm-artifact
          commit: ${{ github.sha }}
          if_no_artifact_found: fail

      - name: Locate downloaded WASM
        id: wasm
        run: |
          WASM_FILE=$(find wasm-artifact -name '*.wasm' -type f | head -n 1)
          if [ -z "$WASM_FILE" ]; then
            echo "❌ No WASM file found in downloaded contract-wasm artifact"
            exit 1
          fi
          echo "wasm_file=$WASM_FILE" >> $GITHUB_OUTPUT
          echo "Using tested WASM artifact: $WASM_FILE"

      - name: Verify WASM size
        run: |
          size=$(stat -c%s "${{ steps.wasm.outputs.wasm_file }}")
          echo "Tested WASM size: $size bytes"
          if [ $size -gt ${{ env.WASM_SIZE_LIMIT_BYTES }} ]; then
            echo "❌ WASM size $size exceeds limit of ${{ env.WASM_SIZE_LIMIT_BYTES }} bytes"
            exit 1
          fi
          echo "✅ WASM size check passed"
        env:
          WASM_SIZE_LIMIT_BYTES: "65536"

      - name: Verify WASM hash matches tested/deployed build
        id: hash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXPECTED_HASH=$(gh run list \
            --workflow contract-deployment.yml \
            --commit "${{ github.sha }}" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId' | \
            xargs -I{} gh run view {} --json jobs \
            --jq '.jobs[] | select(.name == "build-and-test") | .steps[] | select(.name == "Compute contract hash") | .outputs.contract-hash')
          if [ -z "$EXPECTED_HASH" ] || [ "$EXPECTED_HASH" = "null" ]; then
            echo "❌ Could not retrieve contract-hash from contract-deployment.yml for commit ${{ github.sha }}"
            exit 1
          fi
          ACTUAL_HASH=$(sha256sum "${{ steps.wasm.outputs.wasm_file }}" | awk '{print $1}')
          echo "Expected (tested/deployed) hash: $EXPECTED_HASH"
          echo "Actual (release artifact) hash: $ACTUAL_HASH"
          if [ "$EXPECTED_HASH" != "$ACTUAL_HASH" ]; then
            echo "❌ SHA-256 mismatch: release WASM does not match the tested/deployed build"
            exit 1
          fi
          echo "✅ SHA-256 matches the tested/deployed build"
          echo "sha256=$ACTUAL_HASH" >> $GITHUB_OUTPUT

      - name: Upload WASM to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ steps.wasm.outputs.wasm_file }}
          tag_name: ${{ github.ref_name }}
          body: |
            ${{ steps.cliff.outputs.content }}

            ---
            **Verified WASM artifact**
            - SHA-256: `${{ steps.hash.outputs.sha256 }}`
            - Source: `contract-deployment.yml` (`build-and-test` job, commit `${{ github.sha }}`)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
