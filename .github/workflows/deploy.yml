name: Infrastructure Deployment

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.5.0

jobs:
  validate-secrets:
    name: Validate Required Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets are set
        run: |
          MISSING=0
          
          # Check environment-specific secrets
          if [ -z "${{ secrets.AWS_ROLE_DEV }}" ]; then
            echo "❌ Missing secret: AWS_ROLE_DEV"
            MISSING=1
          fi
          if [ -z "${{ secrets.AWS_ROLE_STAGING }}" ]; then
            echo "❌ Missing secret: AWS_ROLE_STAGING"
            MISSING=1
          fi
          if [ -z "${{ secrets.AWS_ROLE_PROD }}" ]; then
            echo "❌ Missing secret: AWS_ROLE_PROD"
            MISSING=1
          fi
          
          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "Deploy cannot proceed without required AWS role secrets."
            echo "Configure the following in repository settings:"
            echo "  - AWS_ROLE_DEV: IAM role ARN for dev environment"
            echo "  - AWS_ROLE_STAGING: IAM role ARN for staging environment"
            echo "  - AWS_ROLE_PROD: IAM role ARN for production environment"
            exit 1
          fi
          
          echo "✅ All required secrets are configured"

  security-scan:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    needs: validate-secrets
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          # Fail on HIGH and CRITICAL severity findings only
          soft_fail_on: LOW,MEDIUM
          output_format: cli
          # Skip checks that are intentional/acceptable in this architecture:
          # CKV_AWS_91  - ALB access logs (cost tradeoff, tracked separately)
          # CKV2_AWS_28 - WAF on ALB (tracked separately)
          skip_check: CKV_AWS_91,CKV2_AWS_28

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [validate-secrets, security-scan]
    strategy:
      matrix:
        environment: [dev, staging, prod]
    env:
      TF_VAR_db_username: ${{ secrets[format('DB_USERNAME_{0}', matrix.environment)] }}
      TF_VAR_db_password: ${{ secrets[format('DB_PASSWORD_{0}', matrix.environment)] }}
      TF_VAR_hmac_key: ${{ secrets[format('HMAC_KEY_{0}', matrix.environment)] }}
      TF_VAR_sendgrid_api_key: ${{ secrets[format('SENDGRID_API_KEY_{0}', matrix.environment)] }}
      TF_VAR_api_signing_key: ${{ secrets[format('API_SIGNING_KEY_{0}', matrix.environment)] }}
      TF_VAR_acm_certificate_arn: ${{ secrets[format('ACM_CERTIFICATE_ARN_{0}', matrix.environment)] }}
      TF_VAR_api_image_uri: ${{ secrets[format('API_IMAGE_URI_{0}', matrix.environment)] }}
      TF_VAR_redis_auth_token: ${{ secrets[format('REDIS_AUTH_TOKEN_{0}', matrix.environment)] }}
      TF_VAR_sendgrid_key_rotated_at: ${{ secrets[format('SENDGRID_KEY_ROTATED_AT_{0}', matrix.environment)] }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_{0}', matrix.environment)] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve backend config
        id: backend
        run: |
          case "${{ matrix.environment }}" in
            staging) echo "file=environments/staging/backend.hcl" >> $GITHUB_OUTPUT ;;
            prod)    echo "file=environments/production/backend.hcl" >> $GITHUB_OUTPUT ;;
            *)       echo "file=backend-config.hcl" >> $GITHUB_OUTPUT ;;
          esac

      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: terraform init -backend-config="${{ steps.backend.outputs.file }}"

      - name: Terraform Validate
        working-directory: infrastructure/terraform
        run: terraform validate -var-file="environments/ci-validate.tfvars"

      - name: Terraform Plan
        working-directory: infrastructure/terraform
        run: |
          terraform plan \
            -lock=true \
            -lock-timeout=5m \
            -var-file="environments/${{ matrix.environment }}.tfvars" \
            -out=tfplan-${{ matrix.environment }}

      - name: Upload plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ matrix.environment }}
          path: infrastructure/terraform/tfplan-${{ matrix.environment }}

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        environment: [dev, staging, prod]
      max-parallel: 1
    # Ties each matrix leg to a GitHub Environment of the same name. Configure
    # a "prod" environment with required reviewers in repo settings so that
    # leg pauses for manual approval; dev/staging can stay unprotected and will
    # keep auto-applying on merge to main, matching environments/README.md.
    environment: ${{ matrix.environment }}
    env:
      TF_VAR_db_username: ${{ secrets[format('DB_USERNAME_{0}', matrix.environment)] }}
      TF_VAR_db_password: ${{ secrets[format('DB_PASSWORD_{0}', matrix.environment)] }}
      TF_VAR_hmac_key: ${{ secrets[format('HMAC_KEY_{0}', matrix.environment)] }}
      TF_VAR_sendgrid_api_key: ${{ secrets[format('SENDGRID_API_KEY_{0}', matrix.environment)] }}
      TF_VAR_api_signing_key: ${{ secrets[format('API_SIGNING_KEY_{0}', matrix.environment)] }}
      TF_VAR_acm_certificate_arn: ${{ secrets[format('ACM_CERTIFICATE_ARN_{0}', matrix.environment)] }}
      TF_VAR_api_image_uri: ${{ secrets[format('API_IMAGE_URI_{0}', matrix.environment)] }}
      TF_VAR_redis_auth_token: ${{ secrets[format('REDIS_AUTH_TOKEN_{0}', matrix.environment)] }}
      TF_VAR_sendgrid_key_rotated_at: ${{ secrets[format('SENDGRID_KEY_ROTATED_AT_{0}', matrix.environment)] }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_{0}', matrix.environment)] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check SLO Compliance (Production Only)
        if: matrix.environment == 'prod'
        run: |
          node performance/scripts/check-slo-compliance.js
        env:
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}

      - name: Resolve backend config
        id: backend
        run: |
          case "${{ matrix.environment }}" in
            staging) echo "file=environments/staging/backend.hcl" >> $GITHUB_OUTPUT ;;
            prod)    echo "file=environments/production/backend.hcl" >> $GITHUB_OUTPUT ;;
            *)       echo "file=backend-config.hcl" >> $GITHUB_OUTPUT ;;
          esac

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: infrastructure/terraform

      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: terraform init -backend-config="${{ steps.backend.outputs.file }}"

      - name: Terraform Apply
        working-directory: infrastructure/terraform
        run: terraform apply -lock=true -lock-timeout=5m -auto-approve tfplan-${{ matrix.environment }}

      - name: Output infrastructure details
        working-directory: infrastructure/terraform
        run: |
          # Human-readable output still relies on Terraform's own `sensitive`
          # redaction, so it's safe to print to the (already access-controlled) logs.
          terraform output
          # -json bypasses that redaction entirely, so strip the sensitive keys
          # ourselves before anything touches disk / an uploaded artifact.
          terraform output -json | jq 'del(.rds_endpoint, .redis_endpoint)' > /tmp/outputs-${{ matrix.environment }}.json

      - name: Upload outputs
        uses: actions/upload-artifact@v7
        with:
          name: outputs-${{ matrix.environment }}
          path: /tmp/outputs-${{ matrix.environment }}.json
